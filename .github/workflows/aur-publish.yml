name: Publish to AUR

on:
  push:
    tags:
      - 'v*'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      is_stable: ${{ steps.check.outputs.is_stable }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Analyze tag
        id: check
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" =~ -(alpha|beta|rc) ]]; then
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          fi

  publish-aur:
    needs: check-version
    if: needs.check-version.outputs.is_stable == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Sy --noconfirm git openssh

      - name: Checkout aspm27
        uses: actions/checkout@v4

      - name: Prepare build user
        run: |
          useradd -m builder
          chown -R builder:builder .

      - name: Update PKGBUILD version
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" aur/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD

      - name: Compute sha256sum
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          curl -sL -o source.tar.gz \
            "https://github.com/fredima2x/aspm27/archive/refs/tags/v${VERSION}.tar.gz"
          SHA=$(sha256sum source.tar.gz | cut -d' ' -f1)
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA}')/" aur/PKGBUILD

      - name: Generate .SRCINFO
        run: |
          chown -R builder:builder .
          su builder -c "cd aur && makepkg --printsrcinfo > .SRCINFO"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/aur
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/aur -o UserKnownHostsFile=~/.ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Push to AUR
        env:
          GIT_AUTHOR_NAME: "aspm27-ci"
          GIT_AUTHOR_EMAIL: "ci@fredima.de"
          GIT_COMMITTER_NAME: "aspm27-ci"
          GIT_COMMITTER_EMAIL: "ci@fredima.de"
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          git clone ssh://aur@aur.archlinux.org/aspm27-server.git aur-repo
          cp aur/PKGBUILD aur/.SRCINFO aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO
          git commit -m "Update to version ${VERSION}" || echo "Nothing to commit"
          git push origin master
