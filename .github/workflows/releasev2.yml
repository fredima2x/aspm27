name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
      skip_binaries: ${{ steps.check.outputs.skip_binaries }}
      build_server: ${{ steps.check.outputs.build_server }}
      build_desktop: ${{ steps.check.outputs.build_desktop }}
    steps:
      - name: Analyze tag
        id: check
        run: |
          TAG="${{ github.ref_name }}"

          # Muss mit v starten (Trigger filtert schon, hier nur doppelte Absicherung)
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Alpha-Tags komplett ignorieren, kein Release, kein Prerelease
          if [[ "$TAG" =~ -alpha ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

          # Release-Typ
          if [[ "$TAG" =~ -beta ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "skip_binaries=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ -rc ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "skip_binaries=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "skip_binaries=false" >> "$GITHUB_OUTPUT"
          fi

          # Welches Projekt gebaut werden soll
          if [[ "$TAG" =~ -server ]]; then
            echo "build_server=true" >> "$GITHUB_OUTPUT"
            echo "build_desktop=false" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ -desktop ]]; then
            echo "build_server=false" >> "$GITHUB_OUTPUT"
            echo "build_desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_server=true" >> "$GITHUB_OUTPUT"
            echo "build_desktop=true" >> "$GITHUB_OUTPUT"
          fi

  build-server:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.skip_binaries == 'false' && needs.check-version.outputs.build_server == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: server
            asset_name: server-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: server.exe
            asset_name: server-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: server
            asset_name: server-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: server
            asset_name: server-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true
      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "server -> target"
      - name: Build release binary
        working-directory: ./server
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename binary
        shell: bash
        run: |
          cp server/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ./${{ matrix.asset_name }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  build-desktop:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.skip_binaries == 'false' && needs.check-version.outputs.build_desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      # Nur unter Linux notwendig fuer webkit2gtk / AppImage build deps
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: ./desktop
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Collect bundle artifacts
        shell: bash
        run: |
          mkdir -p dist
          # Sammelt alle bekannten Tauri-Bundle-Formate ein, unabhaengig davon
          # welche in tauri.conf.json aktiv sind. .app Ordner (macOS) werden
          # bewusst ignoriert, da sie schon im .dmg enthalten sind.
          find desktop/src-tauri/target/${{ matrix.target }}/release/bundle \
            -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) \
            -exec cp {} dist/ \;
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: dist/*

  release:
    needs: [check-version, build-server, build-desktop]
    if: always() && needs.check-version.result == 'success' && needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        if: needs.check-version.outputs.skip_binaries == 'false'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ needs.check-version.outputs.skip_binaries == 'false' && 'artifacts/*' || '' }}
          prerelease: ${{ needs.check-version.outputs.is_prerelease }}
          generate_release_notes: true
