name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
      skip_binaries: ${{ steps.check.outputs.skip_binaries }}
    steps:
      - name: Analyze tag
        id: check
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ -(alpha|beta) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "skip_binaries=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ -rc ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "skip_binaries=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "skip_binaries=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.skip_binaries == 'false'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: server
            asset_name: server-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: server.exe
            asset_name: server-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: server
            asset_name: server-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: server
            asset_name: server-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true
      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "server -> target"
      - name: Build release binary
        working-directory: ./server
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename binary
        shell: bash
        run: |
          cp server/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ./${{ matrix.asset_name }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: [check-version, build]
    if: always() && needs.check-version.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        if: needs.check-version.outputs.skip_binaries == 'false'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ needs.check-version.outputs.skip_binaries == 'false' && 'artifacts/*' || '' }}
          prerelease: ${{ needs.check-version.outputs.is_prerelease }}
          generate_release_notes: true
