<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aspm</title>
    <link rel="stylesheet" href="css/contacts-window.css">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/chat-window.css">
</head>

<body>
    <div class="contacts-window">
        <div class="top-contact-bar">
            <input type="search" class="contact-search-bar" placeholder="Search Contacts">
        </div>
        <div class="contacts">
        </div>
    </div>
    </div>
    <div class="chat-window">
        <div class="opened-contact">
            <div class="opened-contact-picture-cont">
                <img src="imgs/kreise.pdf" class="opened-contact-picture">
            </div>
            <div class="contact-info">
                <p class="opened-contact-heading">Contact 1</p>
                <p class="opened-contact-number"> Number: 1234567890</p>
                <p class="opened-contact-name"> Name: Max Mustermann</p>
            </div>
        </div>
        <div class="chat-area">
        </div>
        <div class="message-bar">
            <input type="text" class="message-text-bar" placeholder="Message">
            <button class="send-button">Send</button>
            <button class="actions-button">Delete Message</button>
        </div>

    </div>
    <script src="js/app.js"></script>
</body>

</html>
