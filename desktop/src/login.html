<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="styles/login/general.css">
  <link rel="stylesheet" href="styles/login/login-page.css">
</head>

<body>
  <div class="login-page">
    <h2 class="heading">Welcome Back!</h2>
    <p class="sign-in-text">Sign in:</p>

    <input type="text" placeholder="Username or id" class="username-input">
    <input type="text" placeholder="Password" class="password-input">
    
    <button class="sign-in-button" onclick="">Sign in</button>

    <p class="sign-up-text">Don't have an account yet?
      <a href="register.html" class="sign-up-link">Sign up</a>
    </p>

  </div>
  <script>
    const passwordInput = document.querySelector('.password-input');

    document.querySelector(".sign-in-button").addEventListener("click", () => {
      document.startViewTransition(() => {
        window.location.href = "chat.html";
      });

      if (length(passwordInput.value) < 8) {
        alert('Password must be at least 8 characters long');
      } else if (length(passwordInput.value) > 64) {
        alert("Password can't be longer than 64 charaters");
      }
    });

  </script>
</body>

</html>
