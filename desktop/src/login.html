<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="styles/login/general.css">
  <link rel="stylesheet" href="styles/login/login-page.css">
</head>

<body>
  <div class="login-page">
    <h2 class="heading">Welcome Back!</h3> 
    <p class="sign-in-text">Sign in:</p>
    <input type="text" placeholder="Username or id" class="username-input">
    <input type="text" placeholder="Password" class="password-input">
    <button class="sign-in-button">Sign in</button>
    <p class="sign-up-text">Dont have an account yet?</p>
    <a href="register.html" class="sign-up-link">Sign up</a>
  </div>
  <script type="module" href="scripts/login.js"></script>
</body>

</html>
