<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aspm</title>
  <link rel="stylesheet" href="styles/chat-window.css">
  <link rel="stylesheet" href="styles/contacts-window.css">
  <link rel="stylesheet" href="styles/general.css">
</head>

<body>
  <div class="contacts-window">
    <div class="top-contact-bar">
      <input type="search" class="contact-search-bar" placeholder="Search Chats">
    </div>
    <div class="contacts">
      <p class="no-chats-placeholder">No chats found</p>
      <div class="add-contact-button-cont">
        <button class="add-contact-button">+</button>
      </div>
    </div>
  </div>
  </div>
  <div class="chat-window">
    <div class="opened-contact">
      <div class="opened-contact-picture-cont">
        <img src="imgs/kreise.pdf" class="opened-contact-picture">
      </div>
      <div class="contact-info">
        <p class="opened-contact-heading">Contact 1</p>
        <p class="opened-contact-number"> Number: 1234567890</p>
        <p class="opened-contact-name"> Name: Max Mustermann</p>
      </div>
    </div>
    <div class="chat-area">
    </div>
    <div class="message-bar">
      <input type="text" class="message-text-bar" placeholder="Message">
      <button class="send-button">Send</button>
      <button class="actions-button" onclick="deleteLastMessage();">Delete Message</button>
    </div>

  </div>
  <script type="module" src="scripts/main.js"></script>
</body>

</html>
